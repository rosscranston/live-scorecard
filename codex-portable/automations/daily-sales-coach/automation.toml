prompt = "Run the Daily Sales Coach for the current local date in America/Los_Angeles.\n\nUse Circleback to find every recording from that local date. Review the full transcript for each recording before coaching it. Use Max's and Ross's feedback in Notion at https://app.notion.com/p/3c14fe20b9f480858e22e8eb77681cdc, Cranston Sales Standards at https://app.notion.com/p/3bd4fe20b9f481dcb3a9d42727c1562e, and established sales best practices.\n\nWrite the result to the Daily Sales Coach database at https://app.notion.com/p/37e46356d9294ca79e49c87b54ce7159 under the Cranston Sales Operating System. Maintain exactly one entry per AE per date: search for today's Ross Gates entry first, update it if it exists, and create it only if it does not. Set the Date, AE, Recordings Reviewed, Calls Coached, and Status fields accurately. Mark any earlier Ross Gates entry still labeled Today as Complete; never overwrite or delete its coaching content.\n\nThe page must:\n- Lead with the three highest-leverage behaviors for the next sales day.\n- Include strengths worth repeating.\n- Account for every Circleback recording found that day.\n- Give concise bullet-point recommendations for every substantive sales or customer meeting.\n- Separate non-sales, internal, no-show, and insufficient-evidence recordings and explain why they were not scored.\n- Ground every material recommendation in a direct Circleback website link to the exact transcript moment, using the meeting URL with tab=transcript and a timestamp query. Never show only a meeting ID.\n- Use exact transcript evidence. Do not invent quotes, product facts, integrations, commitments, or timestamps.\n- Mark uncertain product claims as needing confirmation and distinguish Max's feedback from general best practice.\n- Clearly label the content as AI coaching.\n- Do not send emails, modify CRM records, or execute post-call follow-up actions.\n\nAfter writing, fetch the Notion database row and page again. Verify that there is one entry for the date, properties are correct, every recording is accounted for, every substantive recommendation has an exact-moment link, and all earlier rows are no longer labeled Today. If verification fails, correct the page or properties and verify again."
