id = "daily-circleback-external-call-sharing-and-access-cleanup"
kind = "cron"
name = "Daily Circleback external-call sharing and access cleanup"
prompt = "At 5:00 PM America/Los_Angeles, perform the daily Circleback external-call sharing and access cleanup for the signed-in user.\n\nScope:\n1. Process every completed Circleback meeting from the current local calendar day that the signed-in user personally attended or owns. Page through all results; do not stop at the first page.\n2. A meeting qualifies as external when at least one attendee email domain is not exactly cranston.ai. Treat email/domain evidence as authoritative. If an attendee email is unavailable, do not guess; record the meeting as needing review.\n3. For every qualifying meeting, ensure max@cranston.ai has Viewer access, which includes notes, action items, transcript, and recording when available. Do not grant Editor access. Do not duplicate an existing share.\n4. On every processed meeting, remove access for each explicitly shared person whose email domain is not exactly cranston.ai by changing their access to None. Also set share-link access to restricted/None so possession of a link does not grant access.\n5. In Circleback Settings > Sharing, verify external invitee default access is None so future external invitees are not automatically granted meeting access.\n6. In Circleback workspace membership, identify active members or viewers whose email domain is not exactly cranston.ai and deactivate them so they lose workspace access. Never remove or deactivate a cranston.ai address. If an external account is the billing owner, workspace owner, or otherwise cannot be safely deactivated without an ownership transfer, do not transfer ownership or guess; leave it unchanged and report the exact blocker.\n7. Use the Circleback connector for bounded discovery/readback and the signed-in browser UI for sharing and permission writes because the connector does not expose those mutations. Before changing a meeting, verify its ID/title/date and current access list. After every write, reopen or refresh the relevant meeting/settings/member view and verify the final state.\n8. Be idempotent: if Max already has Viewer access, external users already have None/no access, link access is already restricted, sharing defaults are already None, or no external workspace members exist, make no redundant change.\n9. Do not send emails or messages. Do not change notes, transcripts, recordings, meeting content, internal members, or any other settings.\n10. Return a concise audit report with: date and timezone; meetings checked; qualifying external meetings; meetings newly shared with Max; already shared; external person access removed; links restricted; external workspace members deactivated; unchanged items; ambiguous attendee emails; blocked items; and exact verification evidence. Never claim a change succeeded without readback verification. If Circleback authentication or browser access is unavailable, make no claims of completion and state the exact sign-in/action needed."
status = "ACTIVE"
rrule = "FREQ=DAILY;BYHOUR=17;BYMINUTE=0;BYSECOND=0"
model = "gpt-5.6-sol"
reasoning_effort = "high"
execution_environment = "local"
